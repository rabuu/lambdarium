[workspace]
members = [
	"cli",
	"tui",
]
default-members = [ "cli" ]

[workspace.dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.17"
crossterm = "0.29.0"
anyhow = "1.0.100"

[package]
name = "lambda-calculator"
version = "0.1.0"
edition = "2024"

[build-dependencies]
lalrpop = "0.22.2"

[dependencies]
thiserror = { workspace = true }
miette = { workspace = true }
lalrpop-util = { version = "0.22.2", features = ["lexer", "unicode"] }
logos = "0.15.1"
